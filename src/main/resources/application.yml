server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: bcmServer
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bcm_db}${DB_QUERY_PARAMS:}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: BcmHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1800000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:5}
    validate-on-migrate: true

security:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  rate-limit:
    registration:
      max-requests: ${RATE_LIMIT_REGISTRATION_MAX:5}
      window-seconds: ${RATE_LIMIT_REGISTRATION_WINDOW:60}
    login:
      max-requests: ${RATE_LIMIT_LOGIN_MAX:5}
      window-seconds: ${RATE_LIMIT_LOGIN_WINDOW:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true

logging:
  level:
    root: INFO
    com.basketapp.bcmserver: INFO
    com.zaxxer.hikari: INFO
