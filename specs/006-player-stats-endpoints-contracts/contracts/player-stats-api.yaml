openapi: 3.0.3
info:
  title: Player Stats Management API
  description: Protected RESTful CRUD endpoints for recording and managing individual basketball player match statistics.
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Local Development Server
paths:
  /api/player-stats:
    post:
      summary: Create player statistics record
      description: |
        Creates a new statistical record for a player in a specific basketball game.
        Requires valid JWT authentication. Request payload is validated prior to database access.
      tags:
        - Player Stats
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlayerStatsRequest'
      responses:
        '201':
          description: Player statistics created successfully
          headers:
            Location:
              description: URI of the newly created player stats resource
              schema:
                type: string
                example: /api/player-stats/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerStatsResponse'
        '400':
          description: Invalid request payload or parameter validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Missing, invalid, or expired JWT bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Referenced game or player does not exist
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    get:
      summary: List player statistics
      description: |
        Retrieves player statistics with optional filtering by game or by player.
        Requires valid JWT authentication.
      tags:
        - Player Stats
      security:
        - bearerAuth: []
      parameters:
        - name: gameId
          in: query
          required: false
          description: Filter statistics by game identifier
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 10
        - name: playerId
          in: query
          required: false
          description: Filter statistics by player identifier
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 4
      responses:
        '200':
          description: Collection of player statistics records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlayerStatsResponse'
        '400':
          description: Invalid query parameter format
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Missing, invalid, or expired JWT bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/player-stats/{id}:
    get:
      summary: Get player statistics by ID
      description: |
        Retrieves detailed statistics for a single player stats record.
        Requires valid JWT authentication.
      tags:
        - Player Stats
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the player statistics record
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 1
      responses:
        '200':
          description: Player statistics record found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerStatsResponse'
        '400':
          description: Invalid ID format (must be a positive integer)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Missing, invalid, or expired JWT bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Player statistics record not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    put:
      summary: Update player statistics
      description: |
        Updates an existing player statistics record.
        Requires valid JWT authentication.
      tags:
        - Player Stats
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the player statistics record to update
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlayerStatsRequest'
      responses:
        '200':
          description: Player statistics record updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerStatsResponse'
        '400':
          description: Invalid request payload or parameter validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Missing, invalid, or expired JWT bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Player statistics record, referenced game, or player not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    delete:
      summary: Delete player statistics
      description: |
        Permanently deletes a player statistics record.
        Requires valid JWT authentication.
      tags:
        - Player Stats
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the player statistics record to delete
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 1
      responses:
        '204':
          description: Player statistics record deleted successfully (No Content)
        '400':
          description: Invalid ID format (must be a positive integer)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '401':
          description: Missing, invalid, or expired JWT bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '404':
          description: Player statistics record not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provide a valid JWT token obtained from `/api/v1/auth/login`.

  schemas:
    CreatePlayerStatsRequest:
      type: object
      required:
        - game_id
        - player_id
      properties:
        game_id:
          type: integer
          format: int64
          minimum: 1
          example: 10
          description: Target game identifier
        player_id:
          type: integer
          format: int64
          minimum: 1
          example: 4
          description: Target player identifier
        minutes:
          type: integer
          minimum: 0
          default: 0
          example: 28
          description: Minutes played
        seconds:
          type: integer
          minimum: 0
          maximum: 59
          default: 0
          example: 45
          description: Seconds played (0 to 59)
        t1a:
          type: integer
          minimum: 0
          default: 0
          example: 6
          description: Free throws attempted
        t1i:
          type: integer
          minimum: 0
          default: 0
          example: 5
          description: Free throws made
        t2a:
          type: integer
          minimum: 0
          default: 0
          example: 10
          description: 2-point shots attempted
        t2i:
          type: integer
          minimum: 0
          default: 0
          example: 7
          description: 2-point shots made
        t3a:
          type: integer
          minimum: 0
          default: 0
          example: 5
          description: 3-point shots attempted
        t3i:
          type: integer
          minimum: 0
          default: 0
          example: 2
          description: 3-point shots made
        oreb:
          type: integer
          minimum: 0
          default: 0
          example: 2
          description: Offensive rebounds
        dreb:
          type: integer
          minimum: 0
          default: 0
          example: 6
          description: Defensive rebounds
        asis:
          type: integer
          minimum: 0
          default: 0
          example: 8
          description: Assists
        rec:
          type: integer
          minimum: 0
          default: 0
          example: 3
          description: Steals / recoveries
        per:
          type: integer
          minimum: 0
          default: 0
          example: 2
          description: Turnovers / ball losses
        falt:
          type: integer
          minimum: 0
          default: 0
          example: 3
          description: Personal fouls
        valuation:
          type: integer
          default: 0
          example: 24
          description: Performance Index Rating (PIR) score (signed integer)

    UpdatePlayerStatsRequest:
      type: object
      required:
        - game_id
        - player_id
      properties:
        game_id:
          type: integer
          format: int64
          minimum: 1
          example: 10
        player_id:
          type: integer
          format: int64
          minimum: 1
          example: 4
        minutes:
          type: integer
          minimum: 0
          default: 0
          example: 30
        seconds:
          type: integer
          minimum: 0
          maximum: 59
          default: 0
          example: 15
        t1a:
          type: integer
          minimum: 0
          default: 0
          example: 6
        t1i:
          type: integer
          minimum: 0
          default: 0
          example: 5
        t2a:
          type: integer
          minimum: 0
          default: 0
          example: 12
        t2i:
          type: integer
          minimum: 0
          default: 0
          example: 8
        t3a:
          type: integer
          minimum: 0
          default: 0
          example: 5
        t3i:
          type: integer
          minimum: 0
          default: 0
          example: 3
        oreb:
          type: integer
          minimum: 0
          default: 0
          example: 2
        dreb:
          type: integer
          minimum: 0
          default: 0
          example: 7
        asis:
          type: integer
          minimum: 0
          default: 0
          example: 9
        rec:
          type: integer
          minimum: 0
          default: 0
          example: 4
        per:
          type: integer
          minimum: 0
          default: 0
          example: 1
        falt:
          type: integer
          minimum: 0
          default: 0
          example: 2
        valuation:
          type: integer
          default: 0
          example: 29

    PlayerStatsResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        game_id:
          type: integer
          format: int64
          example: 10
        player_id:
          type: integer
          format: int64
          example: 4
        minutes:
          type: integer
          example: 28
        seconds:
          type: integer
          example: 45
        t1a:
          type: integer
          example: 6
        t1i:
          type: integer
          example: 5
        t2a:
          type: integer
          example: 10
        t2i:
          type: integer
          example: 7
        t3a:
          type: integer
          example: 5
        t3i:
          type: integer
          example: 2
        oreb:
          type: integer
          example: 2
        dreb:
          type: integer
          example: 6
        asis:
          type: integer
          example: 8
        rec:
          type: integer
          example: 3
        per:
          type: integer
          example: 2
        falt:
          type: integer
          example: 3
        valuation:
          type: integer
          example: 24

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
          example: about:blank
        title:
          type: string
          example: Validation Failed
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: Validation failed for request payload
        instance:
          type: string
          format: uri
          example: /api/player-stats
        invalidParams:
          type: object
          additionalProperties:
            type: string
          example:
            game_id: game_id is required
            seconds: seconds must be between 0 and 59

